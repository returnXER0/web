<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="../Global.css">
    <link rel="stylesheet" href="letsConnectGlobal.css">
    <link rel="stylesheet" href="../topBar.css">
    <script src="../navbar.js"></script>
</head>
<body>
    <rx-navbar>
        <!-- cheating mat kar lavde - Engilsh me bolu to Do not cheat you bastard-->
    </rx-navbar>

    <div id="mainContainer">
        <div id="leftSec">
                <form id="connect-form">

    <!-- 1. Name -->
    <div>
        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Your name"
            required
        >
    </div>


    <!-- 2. Phone -->
    <div>
        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Your phone number"
            required
        >
    </div>


    <!-- 3. Email -->
    <div>
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
        >
    </div>


    <!-- 4. Organization -->
    <div>
        <label for="organization">Organization <span>(Optional)</span></label>
        <input
            type="text"
            id="organization"
            name="organization"
            placeholder="Your organization"
        >
    </div>


    <!-- 5. Social / Website -->
    <div>
        <label for="social_link">Social / Website Link <span>(Optional)</span></label>
        <input
            type="url"
            id="social_link"
            name="social_link"
            placeholder="https://..."
        >
    </div>


    <!-- 6. Budget -->
    <div>
        <label for="budget">Estimated Budget</label>

        <select
            id="budget"
            name="budget"
            required
        >
            <option value="" disabled selected>
                Select your budget
            </option>

            <option value="₹2,500- ₹5,000">
                ₹2,500- ₹5,000
            </option>

            <option value="₹5,000 - ₹8,000">
                ₹5,000 - ₹8,000
            </option>
           <option value="₹8,000 - ₹10,000">
                ₹8,000 - ₹10,000
            </option>

            <option value="₹10,000 - ₹15,000">
                ₹10,000 - ₹15,000
            </option>

            <option value="₹20,000+">
                ₹20,000+
            </option>

            <option value="Not sure yet">
                Not sure yet
            </option>
        </select>
    </div>


    <!-- 7. Services -->
    <fieldset>

        <legend>
            What service are you looking for?
        </legend>

        <label>
            <input
                type="checkbox"
                name="services"
                value="2D Animation"
            >
            2D Animation
        </label>

        <label>
            <input
                type="checkbox"
                name="services"
                value="2D Parallax Animation"
            >
            2D Parallax Animation
        </label>

        <label>
            <input
                type="checkbox"
                name="services"
                value="Interactive 2D"
            >
            Interactive 2D
        </label>

        <label>
            <input
                type="checkbox"
                name="services"
                value="3D Animation"
            >
            3D Animation
        </label>

        <label>
            <input
                type="checkbox"
                name="services"
                value="3D Parallax Animation"
            >
            3D Parallax Animation
        </label>

        <label>
            <input
                type="checkbox"
                name="services"
                value="Interactive 3D"
            >
            Interactive 3D
        </label>

        <label>
            <input
                type="checkbox"
                name="services"
                value="Basic Website / Logical Core Website"
            >
            Basic Website / Logical Core Website
        </label>

        <label>
            <input
                type="checkbox"
                name="services"
                value="Portfolio Website"
            >
            Portfolio Website
        </label>

        <label>
            <input
                type="checkbox"
                name="services"
                value="E-commerce Website"
            >
            E-commerce Website
        </label>

        <label>
            <input
                type="checkbox"
                name="services"
                value="Other"
            >
            Other
        </label>

    </fieldset>


    <!-- 8. Additional Note -->
    <div>
        <label for="message">
            Additional Note
        </label>

        <textarea
            id="message"
            name="message"
            placeholder="Tell us about your project..."
            rows="6"
        ></textarea>
    </div>

    <!-- Submit -->
    <button type="submit">
        Let's Connect
    </button>

</form>

        </div>
        <div id="rightSec">
            <label for="date">Preferred Date & Time</label>

        <input
        type="text"
            id="date"
            name="date"
            placeholder="Select date & time"
            readonly
            required
        >
        </div>
    </div>





<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="letsConnect.js"></script>
</body>
</html>
